<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NottsBank — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <nav><h1>NottsBank Budgeting Tracker</h1></nav>
  <div class="login-wrap">
    <div class="login-card">
      <h2>Sign in to your account</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. alice" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button onclick="doLogin()">Log in</button>
      <p class="error-msg" id="login-error"></p>
      <div class="login-link">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
      <div class="login-link" style="border-top:none; padding-top:0.5rem; font-size:0.8rem; color:#888;">
        Demo: <strong>alice</strong> or <strong>bob</strong> — password: <strong>password123</strong>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
